<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل الطلاب - ميزان أكاديمي</title>
    
    <!-- تحديث الروابط لنسخة Compat لضمان عمل الكود بشكل صحيح -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-dark: #0d3b1f; --primary: #1a5c33; --primary-light: #2d7d47;
            --secondary: #d4af37; --secondary-light: #e6c547; --accent: #c9a961;
            --success: #27ae60; --light-bg: #f9f7f4; --cream: #faf8f3;
            --dark-text: #1a1a1a; --text-light: #4a4a4a; --border: rgba(212, 175, 55, 0.25);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.12);
        }

        body {
            font-family: 'Almarai', sans-serif;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
            overflow-x: hidden;
        }

        .container { max-width: 500px; width: 100%; position: relative; z-index: 1; }

        .header { text-align: center; margin-bottom: 30px; color: white; }
        .logo { font-size: 4rem; margin-bottom: 10px; display: inline-block; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .form-card {
            background: var(--cream); padding: 40px; border-radius: 25px;
            box-shadow: var(--shadow-lg); border: 1px solid var(--border);
            position: relative;
        }

        .form-header { margin-bottom: 25px; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
        .form-header h2 { color: var(--primary); font-size: 1.6rem; display: flex; align-items: center; gap: 10px; }
        .form-header h2::before { content: ''; width: 5px; height: 25px; background: var(--secondary); border-radius: 3px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--primary); font-weight: 700; }
        input, select {
            width: 100%; padding: 12px 15px; border: 2px solid var(--border);
            border-radius: 12px; font-family: inherit; transition: 0.3s;
        }
        input:focus, select:focus { outline: none; border-color: var(--secondary); box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1); }

        .btn-submit {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, var(--secondary), var(--secondary-light));
            color: var(--primary-dark); font-weight: 800; cursor: pointer; transition: 0.3s;
        }
        .btn-submit:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }

        .message {
            padding: 15px; border-radius: 10px; margin-bottom: 20px;
            display: none; font-weight: 700; text-align: center;
        }
        .message.show { display: block; }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }

        .loading-spinner {
            width: 18px; height: 18px; border: 3px solid rgba(0,0,0,0.1);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite; display: inline-block; margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">⚖️</div>
        <h1>ميزان أكاديمي</h1>
        <p>الرادار التعليمي الأول في العراق</p>
    </div>

    <div class="form-card">
        <div class="form-header">
            <h2>تسجيل طالب جديد</h2>
        </div>

        <div id="message" class="message"></div>

        <form id="registrationForm">
            <div class="form-group">
                <label>اسم الطالب الكامل <span>*</span></label>
                <input type="text" id="studentName" placeholder="مثال: أحمد علي حسين" required>
            </div>

            <div class="form-group">
                <label>الفرع الدراسي <span>*</span></label>
                <select id="studentBranch" required>
                    <option value="">-- اختر الفرع --</option>
                    <option value="علمي">سادس علمي</option>
                    <option value="أدبي">سادس أدبي</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="btnText">إرسال البيانات</span>
            </button>
        </form>
    </div>
</div>

<script>
    // الإعدادات مالتك
    const firebaseConfig = {
        apiKey: "AIzaSyAh5y_SsMjRB4c2EjTKyfohOZ6nwpPogkU",
        authDomain: "mizam-30a24.firebaseapp.com",
        databaseURL: "https://mizam-30a24-default-rtdb.firebaseio.com",
        projectId: "mizam-30a24",
        storageBucket: "mizam-30a24.firebasestorage.app",
        messagingSenderId: "73954952462",
        appId: "1:73954952462:web:19dc91c40b6c39498d035f",
        measurementId: "G-G41PPG7L74"
    };

    // تهيئة Firebase بالنمط المتوافق
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const form = document.getElementById('registrationForm');
    const msgDiv = document.getElementById('message');
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('studentName').value.trim();
        const branch = document.getElementById('studentBranch').value;

        // تعطيل الزر ومنع تكرار النقرات
        btn.disabled = true;
        btnText.innerHTML = '<span class="loading-spinner"></span> جاري الحفظ...';

        try {
            await db.collection('students').add({
                name: name,
                branch: branch,
                registeredAt: firebase.firestore.FieldValue.serverTimestamp() // أفضل للتوقيت
            });

            // نجاح
            msgDiv.textContent = "تم تسجيل الطالب بنجاح في ميزان!";
            msgDiv.className = "message show success";
            form.reset();
        } catch (error) {
            console.error(error);
            msgDiv.textContent = "حدث خطأ! تأكد من إعدادات Rules في Firestore.";
            msgDiv.className = "message show error";
        } finally {
            btn.disabled = false;
            btnText.textContent = "إرسال البيانات";
            setTimeout(() => msgDiv.className = "message", 5000);
        }
    });
</script>

</body>
</html>
